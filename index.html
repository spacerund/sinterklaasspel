<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sinterklaasspel</title>
<meta name="robots" content="noindex">
<style>
  :root { color-scheme: dark; }
  html, body { height: 100%; margin: 0; }
  body {
    background: radial-gradient(ellipse at 50% 35%, #4a1212 0%, #1c0606 60%, #0d0303 100%);
    color: #f3e6c8; font-family: Georgia, "Times New Roman", serif;
    display: grid; place-items: center; text-align: center; padding: 0 16px;
  }
  h1 { font-weight: normal; letter-spacing: .08em; font-size: clamp(2rem, 7vw, 4rem); margin: 0 0 .4em; color: #e8c766; }
  p { font-size: clamp(1rem, 3.5vw, 1.25rem); opacity: .8; margin: 0; }
</style>
</head>
<body>
  <main>
    <h1>Sinterklaasspel</h1>
    <p>De Sint bereidt het spel voor.</p>
  </main>
</body>
</html>
